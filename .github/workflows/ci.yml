name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Font cache and input dismissal
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils xdotool fonts-dejavu-core fontconfig procps
          cargo build --release --locked
          sh tests/resource-check.sh "$PWD/target/release/niruscreensaver"
      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD":/src:ro koalaman/shellcheck:stable \
            -S warning -s sh -e SC1007 /src/install.sh
