# ~/.config/niruui/screensaver.toml; every setting is optional.
# Change it here or with `niruscreensaver --set KEY VALUE` (comments are
# kept), or in the launcher: NIRUX Settings > Screensaver.

# What is shown:
#   "clock"     the clock with the spectrum or a quote (the layouts below)
#   "photos"    a slide show from photos_folder, slow drift and crossfade,
#               with a small clock; without pictures the clock is shown
#   "dark"      black, only "NIRUX - A MINIMAL X11 DESKTOP" gliding across
#               each screen
#   "dark-sid"  as dark, with the NIRUX music while nothing else plays: the
#               folder from NIRULOCK's [pause_music] (lock.toml), default
#               ~/.local/share/nirux/music (NIRUX's own chiptunes); .sid
#               tunes and .ogg/.opus/.flac/.wav files
#   "ascii"     "NIRUX ascii": a large NIRUX banner in ASCII with "A MINIMAL
#               X11 DESKTOP" under it, centred on every screen in the
#               theme's accent colour, typed out behind a blinking cursor,
#               erased and typed again every minute after a short pause
#   "ascii-sid" as ascii, with the music like dark-sid
#   "demo"      a realtime demoscene demo by NIRUDEMO on each screen,
#               silent; dark where nirudemo is missing or fails
#   "shuffle"   one of the scenes in `shuffle`, a new pick every time
scene = "clock"
shuffle = ["clock", "photos", "dark"]
# PNG and JPEG pictures, two folder levels deep. A -4k file wins over the
# same -8k file (the NIRUX wallpaper sets).
photos_folder = "~/Pictures/Wallpapers/NIRU"
photos_seconds = 20

# font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"
font_size = 22.0
clock_size = 88.0

# minimal | terminal | runic | corner | cava
# cava uses the active NIRUX theme and visualises system audio through CAVA.
layout = "cava"
visualizer = true
# What the cava layout shows where the spectrum is drawn:
#   "auto"   the CAVA spectrum only while music or radio plays, otherwise a
#            quote from ~/.config/niru/quotes/ (the default)
#   "cava"   the spectrum alone, as before 0.19 (CAVA runs whenever the display is on)
#   "quotes" quotes alone; CAVA never starts
#   "music"  the spectrum while music plays, otherwise nothing
#   "none"   neither (visualizer = false also means this)
visual = "auto"
# Which quote collections (~/.config/niru/quotes/NAME.txt) to show, by name;
# "*" matches anything, "?" one character. One pattern or an array:
#   quotes = ["*"]                       every collection (the default)
#   quotes = "havamal-sv"                one collection
#   quotes = ["havamal-*", "stoic-en"]   several
# Built-in: havamal-en, havamal-sv, stoic-en, stoic-sv. See the README.
quotes = ["*"]
# Show "Artist – Title" of the playing MPRIS player under the spectrum
# (needs playerctl; followed only while the spectrum is live).
show_media = true

# Optional: use a specific runic font. Missing rune fonts simply omit the
# ornament; the saver never draws missing-glyph boxes.
# rune_font_path = "/usr/share/fonts/truetype/noto/NotoSansRunic-Regular.ttf"

idle_minutes = 10
lock_after_minutes = 5
dpms_off_minutes = 0
show_away_after_seconds = 60

# A key or click always dismisses the screen. Pointer motion does not, so a
# bumped desk does not wake it; set this to dismiss after the pointer has
# moved more than 24 px since the screen appeared.
dismiss_on_motion = false

# The screen fades in from black over 300 ms; true shows it at once, stops
# the photo drift and crossfade, and moves the dark line once a minute.
reduced_motion = false

# Show the machine's hostname under the clock. Off by default, so a screen in
# a shared place does not name the machine.
show_hostname = false

[palette]
background = "000000"
foreground = "e5e5e5"
muted = "a8a8a8"
border = "2a2a2d"
focus = "5a5a60"
